name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build the ReShade add-on and dxgi.dll
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: glass-cockpit-dlss-fix
          path: |
            build/glass-cockpit-dlss-fix.addon64
            build/dxgi.dll
